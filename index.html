<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }

    .meta { color:var(--muted); font-size:0.9rem; margin-bottom:2rem; }
    a { color:var(--accent); }
    .card { background:var(--card); border-radius:12px; padding:18px 20px; margin-top:1rem; }
    .gold { color:var(--gold); }

</head>

      <p>
        <a href="./privacy_policy.html">Privacy Policy</a><br>
        <a href="./terms.html">Terms of Use</a>
      </p>
      <p>Support: <a href="mailto:support@statvoro.app">support@statvoro.app</a></p>

</body>
</html>
